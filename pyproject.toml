[project]
name = "dearfy"
version = "0.1.10a1"
description = "A library for simplifying the creation of complex GUIs using DearPyGUI."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [ "dearpygui>=2.3.1", "loguru>=0.7.3", "rich>=15.0.0", "typing-extensions>=4.16.0",]
[[project.authors]]
name = "Romanin"
email = "semina054@gmail.com"

[dependency-groups]
dev = [ "toml>=0.10.2", "uv>=0.12.3",]

[project.license]
text = "MIT"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [ "RUF001", "RUF002", "RUF003",]
